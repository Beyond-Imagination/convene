# 프론트엔드 배포 — main push 시 정적 export 를 빌드해 S3 sync + CloudFront 무효화.
#
# NEXT_PUBLIC_API_URL 은 정적 export 에서 빌드 타임에 인라인되므로 시크릿으로 주입한다.
# AWS/S3/CloudFront 준비 전엔 repo 변수 FRONTEND_DEPLOY_ENABLED!=true 라 스킵된다.
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared-interfaces/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FRONTEND_DEPLOY_ENABLED == 'true' }}
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: shared-interfaces 빌드
        run: pnpm build:shared

      # NODE_ENV=production 이면 next.config 가 output:'export' 로 out/ 을 만든다.
      - name: 프론트 정적 빌드 (API URL 인라인)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: pnpm --filter @convene/frontend build

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: S3 동기화
        run: aws s3 sync apps/frontend/out "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: CloudFront 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
