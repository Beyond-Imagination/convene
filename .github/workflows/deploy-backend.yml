# 백엔드/ai-worker 배포 — main push(관련 경로) 또는 수동 실행 시:
#   verify(lint/build/test) → build-push(변경된 이미지만) → deploy(EC2 SSH).
#
# - CI(verify)가 성공해야만 build/deploy 가 돈다(needs 로 순서·성공 게이트).
# - 변경된 이미지만 빌드: backend/ai-worker 중 바뀐 것만(dorny/paths-filter). compose·Caddyfile
#   만 바뀐 경우엔 둘 다 스킵하고 deploy 만 수행(git pull 로 설정 갱신). 수동 실행은 둘 다 빌드.
# - 전체는 repo 변수 DEPLOY_ENABLED=true 일 때만(아니면 verify 부터 skipped → 전부 skipped).
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/ai-worker/**'
      - 'packages/shared-interfaces/**'
      - 'docker-compose.prod.yml'
      - 'infra/Caddyfile'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/beyond-imagination/convene-backend
  AIWORKER_IMAGE: ghcr.io/beyond-imagination/convene-ai-worker

jobs:
  # 1) CI 게이트 — 통과해야 아래 잡이 돈다. DEPLOY_ENABLED 가 아니면 여기서 skip → 전부 skip.
  verify:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    uses: ./.github/workflows/verify.yml

  # 2) 변경된 이미지만 빌드해 GHCR push.
  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter 가 push diff 를 보려면 히스토리 필요

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 어떤 이미지가 바뀌었는지 판별(push 일 때만). 수동 실행은 아래 조건의 || 로 둘 다 빌드.
      - name: 변경 경로 판별
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared-interfaces/**'
            aiworker:
              - 'apps/ai-worker/**'

      - name: backend 이미지 빌드+push
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ai-worker 이미지 빌드+push
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.aiworker == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-worker
          file: apps/ai-worker/Dockerfile
          push: true
          tags: |
            ${{ env.AIWORKER_IMAGE }}:latest
            ${{ env.AIWORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) EC2 배포 — GHCR 로그인(GITHUB_TOKEN) → git pull(compose/Caddyfile) → .env 생성 →
  #    이미지 pull(바뀐 것만 실제 갱신) → 재기동. ANNOUNCED_IP 는 IMDS 자동 조회.
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DOMAIN,ACME_EMAIL,CORS_ORIGIN,RTC_MIN_PORT,RTC_MAX_PORT,MEDIASOUP_WORKER_NUM,STT_MODEL_SIZE,MONGO_DB_NAME,IMAGE_TAG,GEMINI_API_KEY,MONGO_URI
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # EC2 public IP 자동 조회(IMDSv2)
            IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120")
            PUBIP=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)

            cd /opt/convene
            git pull --ff-only

            # GitHub Secrets/Variables → .env 생성(.gitignore 처리됨, 커밋 안 됨)
            {
              echo "IMAGE_TAG=${IMAGE_TAG:-latest}"
              echo "DOMAIN=$DOMAIN"
              echo "ACME_EMAIL=$ACME_EMAIL"
              echo "CORS_ORIGIN=$CORS_ORIGIN"
              echo "ANNOUNCED_IP=$PUBIP"
              echo "RTC_MIN_PORT=${RTC_MIN_PORT:-40000}"
              echo "RTC_MAX_PORT=${RTC_MAX_PORT:-40199}"
              echo "MEDIASOUP_WORKER_NUM=${MEDIASOUP_WORKER_NUM:-1}"
              echo "STT_MODEL_SIZE=${STT_MODEL_SIZE:-small}"
              echo "GEMINI_API_KEY=$GEMINI_API_KEY"
              echo "MONGO_URI=$MONGO_URI"
              echo "MONGO_DB_NAME=${MONGO_DB_NAME:-convene-prod}"
            } > .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          RTC_MIN_PORT: ${{ vars.RTC_MIN_PORT }}
          RTC_MAX_PORT: ${{ vars.RTC_MAX_PORT }}
          MEDIASOUP_WORKER_NUM: ${{ vars.MEDIASOUP_WORKER_NUM }}
          STT_MODEL_SIZE: ${{ vars.STT_MODEL_SIZE }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
