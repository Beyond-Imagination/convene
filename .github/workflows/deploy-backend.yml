# 백엔드/ai-worker 배포 — main push 시 이미지를 GHCR 에 빌드·push 하고 EC2 에 배포한다.
#
# build-push 는 항상 실행(이미지 보관). deploy 는 repo 변수 DEPLOY_ENABLED=true 이고
# EC2 시크릿(EC2_HOST/EC2_USER/EC2_SSH_KEY)이 있을 때만 실행 — 인프라 준비 전엔 빌드까지만.
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/ai-worker/**'
      - 'packages/shared-interfaces/**'
      - 'docker-compose.prod.yml'
      - 'infra/Caddyfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/beyond-imagination/convene-backend
  AIWORKER_IMAGE: ghcr.io/beyond-imagination/convene-ai-worker

jobs:
  build-push:
    runs-on: ubuntu-latest
    # 인프라 준비 전엔 전체 비활성 — repo 변수 DEPLOY_ENABLED=true 일 때만 이미지 빌드·push.
    # (게이트 전에는 deploy 잡도 needs 미충족으로 함께 스킵된다.)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context=monorepo root (pnpm workspace + @convene/shared-interfaces 필요).
      - name: backend 이미지 빌드+push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ai-worker 이미지 빌드+push
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-worker
          file: apps/ai-worker/Dockerfile
          push: true
          tags: |
            ${{ env.AIWORKER_IMAGE }}:latest
            ${{ env.AIWORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      # EC2 에서 git pull(compose/Caddyfile 갱신) + GHCR 이미지 pull + 재기동.
      # GHCR 로그인은 EC2 부트스트랩 시 1회 해 둔 상태를 전제로 한다.
      - name: SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/convene
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
