# CI — push(main) / PR 시 lint · build · test 를 돌린다.
# 인프라·도메인 의존 없음. 배포(CD)는 deploy-*.yml 에서 별도로 다룬다.
#
# 테스트는 backend=jest, frontend·shared=vitest (per-package runner, turbo 가 오케스트레이션).
# turbo task graph: test/build 가 ^build(=의존 패키지 빌드) 에 의존하므로 shared-interfaces 가
# 먼저 빌드된 뒤 backend/frontend 가 그 산출물을 참조한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref 에 새 push 가 오면 진행 중인 run 을 취소(러너 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # husky postinstall 비활성화(CI 엔 .git hook 불필요) + mongodb-memory-server 다운로드 캐시.
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node 20 + pnpm store 캐시
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # build 가 shared-interfaces 를 먼저 빌드하고 backend(nest build)·frontend(next build,
      # 타입체크 포함)를 빌드한다. NODE_ENV=production 이면 frontend 가 정적 export(out/) 까지 만든다.
      - name: Build
        run: pnpm build

      # backend jest(ioredis-mock + mongodb-memory-server) + frontend/shared vitest.
      - name: Test
        run: pnpm test
