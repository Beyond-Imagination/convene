# PR 검증 — main·develop 으로의 PR 에서 lint/build/test(verify.yml 재사용).
# push(main·develop) 에서는 돌지 않는다 — 머지 대상 커밋은 여기서 이미 검증됐다.
name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/verify.yml
