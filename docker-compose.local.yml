# 진행 중인 회의 상태는 redis 에만 있다. `down -v` 는 redis-data 볼륨째 지워
# 회의를 전멸시키니 쓰지 말 것(재기동은 `restart` 또는 `up -d`).
services:
  redis:
    image: redis:7.2-alpine
    container_name: convene-redis
    ports:
      - '6379:6379'
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --notify-keyspace-events Ex
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MongoDB 는 Atlas 무료 티어를 사용한다(PLAN.md §3). 운영/개발은 같은 클러스터를
  # 공유하되 MONGO_DB_NAME 으로 database 만 분리한다(예: convene-dev, convene-prod).
  # 로컬 docker mongo 컨테이너는 띄우지 않는다.

  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: Dockerfile
      args:
        STT_MODEL_SIZE: ${STT_MODEL_SIZE:-small}
    container_name: convene-ai-worker
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - STT_MODEL_SIZE=${STT_MODEL_SIZE:-small}
      # 벤치 샘플 수집 — STT_DUMP_DIR 를 채우면 받은 wav 를 그대로 떨군다.
      - STT_DUMP_DIR=${STT_DUMP_DIR:-}
    volumes:
      # 떠낸 샘플과 벤치 스크립트를 호스트와 공유한다.
      - ./apps/ai-worker/bench:/app/bench
    restart: unless-stopped

  # NestJS backend (운영 이미지 검증용). 평상시 dev 는 호스트에서 `nest start --watch`
  # 를 그대로 쓴다 — docker desktop(Windows/Mac) 의 NAT 환경에서는 mediasoup UDP
  # 미디어 경로가 매끄럽지 않다. EC2 단일 인스턴스 배포 시뮬레이션 / 운영 이미지
  # smoke 테스트가 본 서비스의 주 용도.
  #
  # mediasoup RTC 포트는 RTC_MIN_PORT..RTC_MAX_PORT(여기선 40000-40020) 만 매핑한다.
  # 운영에서는 ANNOUNCED_IP 를 EC2 의 public IP 로, 같은 범위를 보안그룹에 열어준다.
  #
  # apps/backend/.env (MONGO_URI / MONGO_DB_NAME / GEMINI_API_KEY 등) 를 env_file 로
  # 끌어온다. 컨테이너 간 통신용 URL(REDIS_URL, AI_WORKER_BASE_URL) 은 아래 environment
  # 에서 .env 를 덮어쓴다.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: convene-backend
    depends_on:
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - AI_WORKER_BASE_URL=http://ai-worker:8000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ANNOUNCED_IP=${ANNOUNCED_IP:-127.0.0.1}
      - RTC_MIN_PORT=${RTC_MIN_PORT:-40000}
      - RTC_MAX_PORT=${RTC_MAX_PORT:-40020}
      - MEDIASOUP_WORKER_NUM=${MEDIASOUP_WORKER_NUM:-1}
      # 벤치 샘플 수집 — `none` 이면 STT 전처리 필터를 끄고 raw 로 뽑는다.
      - FFMPEG_AUDIO_FILTER=${FFMPEG_AUDIO_FILTER:-}
    ports:
      - '5000:5000'
      - '40000-40020:40000-40020/udp'
      - '40000-40020:40000-40020/tcp'
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
