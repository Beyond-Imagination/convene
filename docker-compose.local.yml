services:
  redis:
    image: redis:7.2-alpine
    container_name: migration-redis
    ports:
      - '6379:6379'
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --notify-keyspace-events Ex
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # MongoDB 는 Atlas 무료 티어를 사용한다(PLAN.md §3). 운영/개발은 같은 클러스터를
  # 공유하되 MONGO_DB_NAME 으로 database 만 분리한다(예: migration-dev, migration-prod).
  # 로컬 docker mongo 컨테이너는 띄우지 않는다.

  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: Dockerfile
    container_name: migration-ai-worker
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
